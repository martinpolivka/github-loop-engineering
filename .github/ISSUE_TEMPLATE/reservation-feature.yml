name: Reservation feature request
description: Propose a new, testable capability for the synthetic reservation service.
title: "[Reservation] "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic evidence only. Cite its repository path so a reviewer can verify it.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Which ticket, log, discussion, and decision support this request?
      placeholder: |
        - context/intake/customer-ticket.md — ...
        - context/intake/reservation-api.log — ...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should become possible?
      placeholder: A pharmacist can...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable behavior.
      placeholder: |
        - Given...
        - When...
        - Then...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - Keep the service dependency-free.
        - Use synthetic data only.
        - Preserve existing API behavior.
        - Add deterministic tests.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Which adjacent requests must this change not include?
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Change risk
      options:
        - Low - isolated behavior
        - Medium - API or workflow behavior
        - High - identity, security, deployment, or data boundary
    validations:
      required: true
